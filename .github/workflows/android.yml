
name: Ultimate Rage APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ultimate Rage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Rust for Android
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android dependencies
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Fetch Shaderc dependencies
        run: |
          THIRD_PARTY="platforms/android/app/src/main/cpp/3rdparty/shaderc/third_party"

          git clone https://github.com/KhronosGroup/SPIRV-Tools.git "$THIRD_PARTY/spirv-tools"
          git -C "$THIRD_PARTY/spirv-tools" checkout --detach e4bceacf59fdfe742047e94e41ef65a48999a0dd

          git clone https://github.com/KhronosGroup/SPIRV-Headers.git "$THIRD_PARTY/spirv-headers"
          git -C "$THIRD_PARTY/spirv-headers" checkout --detach 465055f6c9128772e20082e893d974146acf7a02

          git clone https://github.com/KhronosGroup/glslang.git "$THIRD_PARTY/glslang"
          git -C "$THIRD_PARTY/glslang" checkout --detach 09c541ee5b22bbac307987b50d86ec2b4f683d75

      - name: Verify dependencies
        run: |
          test -f platforms/android/app/src/main/cpp/3rdparty/zstd/build/cmake/CMakeLists.txt
          test -f platforms/android/app/src/main/cpp/3rdparty/lz4/build/cmake/CMakeLists.txt
          git submodule status --recursive

      - name: Prepare Gradle
        working-directory: platforms/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Rage-APK
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
